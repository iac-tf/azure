<div class="workshop-toolbar">
  <button type="button" class="btn btn-blue workshop-present-btn">&#9654; Present slides</button>
</div>
<div class="workshop-present-overlay" hidden>
  <div class="workshop-present-chrome">
    <span class="workshop-present-counter"></span>
    <button type="button" class="workshop-present-close" aria-label="Close presentation">&#10005; Close</button>
  </div>
  <div class="workshop-present-slide"></div>
  <div class="workshop-present-nav">
    <button type="button" class="btn workshop-present-prev">&larr; Prev</button>
    <button type="button" class="btn btn-blue workshop-present-next">Next &rarr;</button>
  </div>
</div>
